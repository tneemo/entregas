<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B3D91" />
    <script>
      // Antes de pintar: tema escolhido no painel, ou o do sistema.
      (() => {
        var salvo = null;
        try {
          salvo = localStorage.getItem('entregas:tema');
        } catch {
          // sem acesso ao armazenamento: segue o tema do sistema
        }
        var escuro = salvo ? salvo === 'escuro' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
      })();
    </script>
    <title>Entregas — Painel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
