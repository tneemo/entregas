# Publica a API e o painel num ambiente do wrangler.jsonc: migrations do banco primeiro, depois o Worker.
#
# As migrations rodam antes do código novo entrar no ar, então precisam ser compatíveis com a versão
# anterior por alguns segundos (adicionar coluna/tabela sim; apagar ou renomear em duas etapas).
#
# Segredo necessário no repositório: CLOUDFLARE_API_TOKEN (modelo "Edit Cloudflare Workers" + D1 Edit).
# Opcionais (Sentry no painel): segredo SENTRY_AUTH_TOKEN; variáveis SENTRY_ORG, SENTRY_PROJETO_PAINEL
# e SENTRY_DSN_PAINEL. O DSN da API é um segredo do Worker: wrangler secret put SENTRY_DSN --env <ambiente>.
name: Publicar

on:
  workflow_call:
    inputs:
      ambiente:
        description: homologacao ou producao
        required: true
        type: string

permissions:
  contents: read

jobs:
  publicar:
    name: ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.ambiente }}
      url: ${{ inputs.ambiente == 'producao' && 'https://entregas.joaopedropavanete.workers.dev' || 'https://entregas-homologacao.joaopedropavanete.workers.dev' }}
    # Um deploy por ambiente de cada vez, sem cancelar o que já começou.
    concurrency:
      group: publicar-${{ inputs.ambiente }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      URL_AMBIENTE: ${{ inputs.ambiente == 'producao' && 'https://entregas.joaopedropavanete.workers.dev' || 'https://entregas-homologacao.joaopedropavanete.workers.dev' }}
    steps:
      - name: Conferir o token da Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN no repositório (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparar

      - name: Migrations do banco
        working-directory: apps/api
        run: npx wrangler d1 migrations apply DB --remote --env ${{ inputs.ambiente }}

      # Sentry é opcional: sem as variáveis, o painel sai sem monitoramento e sem envio de source maps.
      - name: Build do painel
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN_PAINEL }}
          VITE_AMBIENTE: ${{ inputs.ambiente }}
          VITE_VERSAO: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJETO_PAINEL }}

      - name: Publicar o Worker
        working-directory: apps/api
        run: npx wrangler deploy --env ${{ inputs.ambiente }} --message "${GITHUB_SHA::7} via GitHub Actions"

      - name: Conferir se está no ar
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$URL_AMBIENTE/api/v1/saude"
