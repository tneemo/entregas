# Atualizações semanais de dependências, agrupadas num PR só (o CI confere cada uma).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      # O SDK do Expo fixa versões compatíveis entre si (e o React acompanha):
      # atualize com `npx expo install --fix` dentro de apps/motoboy.
      # Vale também para bibliotecas nativas que o Expo escolhe a versão, como o Sentry do app.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@sentry/react-native"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    groups:
      actions:
        patterns: ["*"]
