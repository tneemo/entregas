name: Preparar
description: Node da versão do .nvmrc, cache do npm e dependências instaladas pelo package-lock.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Instalar dependências
      shell: bash
      run: npm ci --no-audit --no-fund
